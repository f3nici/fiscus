# Fiscus from the published image; settings go in .env (see .env.example).
name: fiscus

services:
  fiscus:
    image: ${IMAGE_PREFIX:-docker.io/f3nici/fiscus}:${TAG:-latest}
    container_name: fiscus
    restart: unless-stopped
    ports:
      - '${FISCUS_HOST_PORT:-8000}:8000'
    environment:
      FISCUS_SECRET_KEY: '${FISCUS_SECRET_KEY:?set FISCUS_SECRET_KEY in .env (openssl rand -hex 32)}'
      FISCUS_BASE_URL: ${FISCUS_BASE_URL:?set FISCUS_BASE_URL in .env, e.g. https://fiscus.example.com}
      FISCUS_ORIGIN: ${FISCUS_ORIGIN:-}
      FISCUS_RP_ID: ${FISCUS_RP_ID:-}
      FISCUS_TRUSTED_PROXIES: ${FISCUS_TRUSTED_PROXIES:-172.16.0.0/12}
      FISCUS_TIMEZONE: ${FISCUS_TIMEZONE:-Australia/Perth}
      FISCUS_BACKUP_HOUR: ${FISCUS_BACKUP_HOUR:-2}
      FISCUS_BACKUP_RETENTION_DAYS: ${FISCUS_BACKUP_RETENTION_DAYS:-14}
      FISCUS_SETUP_LINK_HOURS: ${FISCUS_SETUP_LINK_HOURS:-48}
      FISCUS_BOOTSTRAP_HOURS: ${FISCUS_BOOTSTRAP_HOURS:-24}
      FISCUS_SESSION_IDLE_DAYS: ${FISCUS_SESSION_IDLE_DAYS:-30}
      FISCUS_SESSION_ABSOLUTE_DAYS: ${FISCUS_SESSION_ABSOLUTE_DAYS:-90}
      FISCUS_LOG_LEVEL: ${FISCUS_LOG_LEVEL:-info}
    volumes:
      # The database, staged uploads and nightly backups.
      - fiscus-data:/data

volumes:
  fiscus-data:
