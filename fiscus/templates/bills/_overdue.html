{# Overdue occurrences with a Mark paid button. Needs `overdue` and `back`. #}
{% from "_macros.html" import money_cell %}
{% if overdue %}
  <div class="card alert-error mb" id="overdue">
    <h2>Overdue</h2>
    <ul class="list">
      {% for o in overdue %}
        <li>
          <span class="grow"><a class="title" href="/bills/{{ o.bill.id }}">{{ o.bill.name }}</a><span class="text-xs muted">was due {{ o.due | d }}</span></span>
          {{ money_cell(-o.share_cents) }}
          <form class="inline" method="post" action="/bills/{{ o.bill.id }}/occurrence/{{ o.due.isoformat() }}/paid">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="back" value="{{ back }}">
            <button class="btn btn-sm" type="submit">Mark paid</button>
          </form>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endif %}
