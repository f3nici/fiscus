{% extends "base.html" %}
{% from "_macros.html" import icon with context %}
{% block title %}Menu{% endblock %}
{% block content %}
  <h1>Menu</h1>
  <div class="more-menu mt">
    {% for s in screens %}
      <a href="{{ s.href }}">{{ icon(s.icon) }} {{ s.label }}</a>
    {% endfor %}
  </div>
  <form class="mt" method="post" action="/auth/logout" hx-boost="false">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="btn w-full" type="submit">Sign out</button>
  </form>
  <p class="muted text-xs center mt">Fiscus {{ version }}</p>
{% endblock %}
