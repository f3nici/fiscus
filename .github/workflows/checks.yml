name: Checks

# Format, types, lint and the whole test suite, in one place.
#
# Called by CI on every push and by Release before it publishes anything under
# a version tag. Two copies of this would eventually disagree, and the copy
# that matters is the one guarding a release.
on:
  workflow_call:

jobs:
  check:
    name: Format, typecheck, lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install (hashes required)
        run: pip install --require-hashes --no-deps -r requirements-dev.lock

      - name: Format check
        run: ruff format --check fiscus tests scripts

      - name: Typecheck
        run: mypy

      - name: Lint
        run: ruff check fiscus tests scripts

      - name: Lint templates
        run: djlint fiscus/templates --lint

      - name: Install Chromium for the browser test
        run: python -m playwright install --with-deps chromium

      - name: Test
        run: pytest
