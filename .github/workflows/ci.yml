name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fiscus

jobs:
  # Shared with the Release workflow, so a release cannot be published against
  # a weaker set of checks than a branch push gets.
  check:
    name: Checks
    uses: ./.github/workflows/checks.yml

  image:
    name: Build, smoke test and push the image
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Forks and fresh clones have no Docker Hub credentials. They still build
      # and smoke test the image; only the push is skipped.
      - name: Docker Hub credentials present?
        id: creds
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "present=$([ -n "$USERNAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fiscus:ci
          build-args: BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: scripts/smoke.sh fiscus:ci

      - name: Log in to Docker Hub
        if: steps.creds.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        if: steps.creds.outputs.present == 'true' && github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push
        if: steps.creds.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Always push branch builds too: a change is verified by pulling and
          # running the published image, not by trusting a green tick.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
