name: Release

# Build and publish the image under a tag you type.
#
# CI publishes every branch build under its branch name and commit sha. This
# is the other half: naming a build you intend to deploy, so the homelab can
# be pointed at TAG=v1.2.0 rather than at a 40-character sha.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish, e.g. v1.0.0'
        required: true
        type: string
      latest:
        description: 'Also move the `latest` tag to this build'
        required: false
        default: true
        type: boolean
      skip_checks:
        description: 'Publish without running the test suite (emergencies only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fiscus

jobs:
  # The tag is typed by a human into a box, so it is checked before it reaches
  # a shell, a registry or a tag list.
  validate:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - name: The tag has to look like a tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'; then
            echo "Refusing \"$TAG\"."
            echo "Use letters, numbers, dot, dash and underscore, starting with a letter or number."
            exit 1
          fi
          if [ "$TAG" = "latest" ]; then
            echo 'Refusing "latest": it is moved by the latest input, not published directly.'
            exit 1
          fi
          echo "Publishing as \"$TAG\"."

  checks:
    name: Checks
    needs: validate
    if: ${{ !inputs.skip_checks }}
    uses: ./.github/workflows/checks.yml

  image:
    name: Build, smoke test and push
    runs-on: ubuntu-latest
    needs: [validate, checks]
    # `always()` so skipping the checks skips the job rather than cancelling
    # the release, while a real test failure still stops it.
    if: ${{ always() && needs.validate.result == 'success' && (needs.checks.result == 'success' || inputs.skip_checks) }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fiscus:release
          build-args: BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke.sh fiscus:release

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Safe to interpolate: the validate job refused anything that is not
      # [a-zA-Z0-9][a-zA-Z0-9._-]{0,63} before this job was allowed to start.
      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_HASH=${{ github.sha }}
          cache-from: type=gha

      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          MOVED_LATEST: ${{ inputs.latest }}
        run: |
          {
            echo "## Published"
            echo
            echo "\`$IMAGE:$TAG\` (latest moved: $MOVED_LATEST)"
            echo
            echo "Deploy: set \`TAG=$TAG\` in .env, then \`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
