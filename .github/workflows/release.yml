name: Release

# Publish the image under a release's version, and move `latest` to it.
#
# CI publishes every merge to main as `beta`. This is the other half: a GitHub
# release (tag v1.2.0 or 1.2.0) publishes the image as 1.2.0 and moves
# `latest`, so the homelab can be pointed at TAG=1.2.0 or follow releases. A
# pre-release publishes its version only. Running it by hand rebuilds a
# version, for a release made before this workflow or one that failed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish, e.g. 1.0.0 (a leading v is dropped)'
        required: true
        type: string
      latest:
        description: 'Also move the `latest` tag to this build'
        required: false
        default: true
        type: boolean
      skip_checks:
        description: 'Publish without running the test suite (emergencies only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fiscus

jobs:
  # The tag is typed by a human, into a box or a release, so it is checked
  # before it reaches a shell, a registry or a tag list.
  validate:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      latest: ${{ steps.tag.outputs.latest }}
      skip_checks: ${{ steps.tag.outputs.skip_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag has to look like a tag, and match the version
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
          INPUT_SKIP_CHECKS: ${{ inputs.skip_checks }}
        run: |
          if [ "$EVENT" = "release" ]; then
            TAG="$RELEASE_TAG"
            LATEST=$([ "$PRERELEASE" = "true" ] && echo false || echo true)
            SKIP_CHECKS=false
          else
            TAG="$INPUT_TAG"
            LATEST="$INPUT_LATEST"
            SKIP_CHECKS="$INPUT_SKIP_CHECKS"
          fi
          # v1.0.0 is published as 1.0.0.
          if [[ "$TAG" =~ ^[vV][0-9] ]]; then
            TAG="${TAG:1}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'; then
            echo "Refusing \"$TAG\"."
            echo "Use letters, numbers, dot, dash and underscore, starting with a letter or number."
            exit 1
          fi
          if [ "$TAG" = "latest" ] || [ "$TAG" = "beta" ]; then
            echo "Refusing \"$TAG\": latest moves with releases and beta with main."
            exit 1
          fi
          # A version number has to be the one the app reports, or the image
          # called 1.2.0 would say 1.1.0 on /readyz and in the app.
          VERSION=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" fiscus/__init__.py)
          if [[ "$TAG" =~ ^[0-9] ]] && [ "$TAG" != "$VERSION" ]; then
            echo "Refusing \"$TAG\": this commit is Fiscus $VERSION."
            echo "Set the version in fiscus/__init__.py and pyproject.toml, or release the commit that has it."
            exit 1
          fi
          echo "Publishing as \"$TAG\" (latest: $LATEST)."
          {
            echo "tag=$TAG"
            echo "latest=$LATEST"
            echo "skip_checks=$SKIP_CHECKS"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: validate
    if: ${{ needs.validate.outputs.skip_checks != 'true' }}
    uses: ./.github/workflows/checks.yml

  image:
    name: Build, smoke test and push
    runs-on: ubuntu-latest
    needs: [validate, checks]
    # `always()` so skipping the checks skips the job rather than cancelling
    # the release, while a real test failure still stops it.
    if: ${{ always() && needs.validate.result == 'success' && (needs.checks.result == 'success' || needs.validate.outputs.skip_checks == 'true') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fiscus:release
          build-args: BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke.sh fiscus:release

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Safe to interpolate: the validate job refused anything that is not
      # [a-zA-Z0-9][a-zA-Z0-9._-]{0,63} before this job was allowed to start.
      # `latest` is only ever the line below, never added by the action.
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.tag }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ needs.validate.outputs.latest }}
          labels: org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_HASH=${{ github.sha }}
          cache-from: type=gha

      - name: Summary
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          MOVED_LATEST: ${{ needs.validate.outputs.latest }}
        run: |
          {
            echo "## Published"
            echo
            echo "\`$IMAGE:$TAG\` (latest moved: $MOVED_LATEST)"
            echo
            echo "Deploy: set \`TAG=$TAG\` (or \`latest\`) in .env, then \`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
