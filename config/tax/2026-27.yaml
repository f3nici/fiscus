# Australian resident individual income tax, 2026-27 financial year.
#
# VERIFY EACH JULY against the ATO before relying on any figure:
#   https://www.ato.gov.au/tax-rates-and-codes/tax-rates-australian-residents
#   https://www.ato.gov.au/individuals-and-families/medicare-and-private-health-insurance/medicare-levy
#
# Source: the ATO's resident tax rates 2026-27 table, checked October 2026:
# nil to $18,200; 15c over $18,200; $4,020 plus 30c over $45,000; $31,020 plus
# 37c over $135,000; $51,370 plus 45c over $190,000; Medicare levy 2 %.
#
# The Medicare levy low-income thresholds below are the 2025-26 figures
# ($28,011 and $35,013 for a single). The 2026-27 ones are usually set in the
# next Budget, so check them each July. The low income tax offset is not used
# (D31).
#
# Fiscus estimates. It is not tax advice. HELP / study loan repayments, the
# Medicare levy surcharge, private health rebates and every other offset are
# not modelled.

financial_year: "2026-27"
start: 2026-07-01
end: 2027-06-30
verified: "Brackets checked against the ATO table in October 2026. Medicare thresholds are the 2025-26 figures until the 2026-27 ones are set."

# Each bracket: income above `over` is taxed at `rate` per dollar.
brackets:
  - over: 0
    rate: "0"
  - over: 18200
    rate: "0.15"
  - over: 45000
    rate: "0.30"
  - over: 135000
    rate: "0.37"
  - over: 190000
    rate: "0.45"

medicare:
  rate: "0.02"
  # Singles: no levy at or below `lower`, phased in at `phase_in_rate` of the
  # excess up to `upper`, then the full rate.
  lower: 28011
  upper: 35013
  phase_in_rate: "0.10"

lito:
  # Low income tax offset.
  max: 700
  full_to: 37500
  first_taper_to: 45000
  first_taper_rate: "0.05"
  second_taper_to: 66667
  second_taper_rate: "0.015"
